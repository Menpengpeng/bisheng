
# 在http区域内一定要添加下面配置, 支持websocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}


server {
	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	listen 3001;

	# Docker 内置 DNS，10s 重新解析容器名 → IP。
	# backend 容器重启后 IP 会变，静态 upstream 会永久缓存旧 IP 导致 502，
	# 必须用变量 + resolver 才能运行时重新解析。
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $backend http://backend:7860;

	 location / {
		root /usr/share/nginx/html/platform;
		index index.html index.htm;
		# 禁止浏览器缓存 index.html
		location = /index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /index.html;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location /workspace/ {
		alias /usr/share/nginx/html/client/;
		index index.html index.htm;
		# 禁止浏览器缓存 /workspace/index.html
		location = /workspace/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /workspace/index.html;
	}

	location ~ ^(/workspace)?/api(/|$) {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass $backend;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 1024m;
		add_header Access-Control-Allow-Origin $host;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location ~ ^(/workspace)?/bisheng|/tmp-dir {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://minio:9000;
	}
}
